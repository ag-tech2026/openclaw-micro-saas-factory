faq:
  - question: "What's the difference between Community and Pro?"
    answer: "Community is free and great for open source projects. Pro adds advanced debugging, private repositories, priority support, and CI/CD integrations."
  - question: "Can I use DevTools Pro with my existing CI/CD pipeline?"
    answer: "Yes! DevTools Pro integrates with all major CI/CD platforms including GitHub Actions, GitLab CI, Jenkins, CircleCI, and Azure Pipelines."
  - question: "Is there a free trial for paid plans?"
    answer: "Yes, all paid plans come with a 14-day free trial. No credit card required to start."
  - question: "How do you handle security for my code?"
    answer: "We take security seriously. All data is encrypted at rest and in transit. We're SOC 2 Type II compliant and offer on-premise deployment for Enterprise customers."

